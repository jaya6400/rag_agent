services:
  valkey:
    image: valkey/valkey
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  app:
    build: .
    container_name: rag_app
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    ports:
     - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - valkey
      - qdrant
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

  worker:
    build: .
    container_name: rag_worker
    command: rq worker default       # <-- correct queue name
    volumes:
      - .:/app
    depends_on:
      - valkey
      - qdrant
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: 6379
      QDRANT_URL: http://qdrant:6333
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
